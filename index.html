<!DOCTYPE html>
<html>
  <head>
    <title>Pikachu</title>
    <meta name="description" content="A Pikachu gigapet">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is Pikachu
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
        <img class="pet-image" src="/images/index.png">
        <div><span class="pet-message"></span></div>
      </section>
      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span>%</strong></div>
        <div>Happiness: <strong><span class="happiness"></span>%</strong></div>
        <div>Energy: <strong><span class="energy"></span>%</strong></div>
        <div class="button-container">
          <button class="treat-button">
            Treat 🫐
          </button>
          <button class="play-button">
            Play 🛝
          </button>
          <button class="exercise-button">
            Exercise 🏋️
          </button>
          <button class="sleep-button">
            Sleep 💤
          </button>
          <button class="pet-button" data-boost="5">
            Pet 🤚
          </button>
          <br>
          <button class="table-button">
            Get Table 👨‍💻
          </button>
          <button class="group-stats-button">
            Get Stats 📊
          </button>
          <button class="special-button">
            🤫
          </button>
          <button class="type-error-button">
            Cause Type Error ⚠️
          </button>
          <br>
          <button class="violation-button">
            Cause Violation ❌
          </button>
          <button class="invalid-image-button">
            404 🚫
          </button>
          <button class = "cause-error-button">
            Cause Error ⛔️
          </button>
        </div>
      </section>
      <section class="log-container">
        <h3><u>Activity Log</u></h3>
        <ul class="activity-log">
          <li>Pikachu is chilling</li>
        </ul>
      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
